version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: topupku_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-topupku_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-topupku_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-topupku_db}
      TZ: Asia/Jakarta
    ports:
      - "5432:5432"
    volumes:
      - topupku_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U topupku_user -d topupku_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - topupku_net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: topupku_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://topupku_user:topupku_secret_password@postgres:5432/topupku_db?schema=public"
      DIRECT_URL: "postgresql://topupku_user:topupku_secret_password@postgres:5432/topupku_db?schema=public"
      TZ: "Asia/Jakarta"
    ports:
      - "3000:3000"
    command: >
      sh -c "npx prisma migrate deploy && npm run db:seed && npm start"
    networks:
      - topupku_net

  nginx:
    image: nginx:1.27-alpine
    container_name: topupku_nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - topupku_net

volumes:
  topupku_pgdata:

networks:
  topupku_net:
    driver: bridge
